  <body class="body">

      <header>
        <!--The Navigation of the website-->

      <main class="home">
        <div class="contact-wrapper">
          <aside class="contact-info">
            <h2>Contact Information</h2>
            <p><strong>Name:</strong> Kyle Johnson</p>
            <p><strong>Email:</strong> kjjohnson138623@mymail.tstc.edu</p>
            <p><strong>Location:</strong> Fort Worth, TX</p>
            <div class="social-link">
              <a href="https://www.linkedin.com/in/kyle-johnson-845718335/" target="_blank"><img src="images/LI-Logo.png" alt="LinkedIn"/></a>

          </aside>

        <!--The form to get more information from us-->
          <form id="request-info" action="https://formsubmit.co/kjjohnson138623@mymail.tstc.edu" method="POST">
            <h2>Message Me</h2>
            <fieldset>
              <!--Users name-->
              <div class="formSpace">
                <label for="name">Name:</label>
                <input name="name" id="name" type="text" /><br />
              </div>
              <!--Users email-->
              <div class="formSpace">
                <label for="email">Email:</label>
                <input name="email" id="email" type="email" placeholder="you@email.com"/><br />
              </div>
              <!--Message-->
              <div class="formSpace">
                <label for="message">Message:</label>
                <textarea name="message" id="message" rows="10" cols="30" placeholder="Type your message here..."></textarea><br />
              </div>
              <!--Submit Reset Buttons-->
              <div class="form-buttons">
                <button class="submit" type="submit">Send Message</button>
                <button class="reset" type="reset">Reset</button>
              </div>
            </fieldset>
          </form>
        </div>
